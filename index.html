<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Hour</title>
<meta name="theme-color" content="#2D6A4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light dark}html,body{margin:0}body{font-size:14px}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-first column, five tabs on a bottom bar; a large ring timer is the centre of the Focus tab. */
:root{
  --bg:#EDF0EA; --surface:#F8FAF6; --soft:#DDE7DC; --ink:#17241C; --muted:#5C6B61; --line:#D2DACF;
  --accent:#2D6A4F; --accent-ink:#FFFFFF; --break:#B0681A; --warn:#B3392F; --pot:#9A6B4B;
  --f-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211B; --soft:#1F2D24; --ink:#E6EEE7; --muted:#93A598; --line:#26352B;
  --accent:#6FCF97; --accent-ink:#0B1A11; --break:#E0A24E; --warn:#EF7A6F; --pot:#B98763; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --soft:#1F2D24; --ink:#E6EEE7; --muted:#93A598; --line:#26352B;
  --accent:#6FCF97; --accent-ink:#0B1A11; --break:#E0A24E; --warn:#EF7A6F; --pot:#B98763; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
#app{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.sm{padding:5px 10px;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.high{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.med{border:1px solid var(--break);color:var(--break);background:transparent}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.done .t{text-decoration:line-through;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{border:0;background:none;padding:8px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
nav button[aria-current=true]{background:var(--soft);color:var(--ink);font-weight:700}
.ringwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 24px}
#clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(40px,13vw,58px);letter-spacing:-.02em}
.phase{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.phase.focus{color:var(--accent)} .phase.break{color:var(--break)}
.shield{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:99px;background:var(--soft);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.off{text-decoration:line-through;color:var(--muted)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.badge{display:flex;gap:10px;align-items:center;padding:8px 0}
.badge .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--muted);flex:none}
.badge.on .dot{background:var(--accent);color:var(--accent-ink)}
.badge:not(.on){opacity:.6}
#modal{position:fixed;inset:0;background:rgba(10,18,13,.6);display:grid;place-items:center;padding:20px;z-index:20}
#modal .card{max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.warnbar{background:transparent;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-size:15px}
.zen #app>header,.zen nav{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Deep Hour<small id="date"></small></div>
    <div class="row">
      <button class="btn sm" data-act="theme" id="themeBtn" aria-label="Change theme">Theme: auto</button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav><div id="nav"></div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var K='deephour.v1';
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var dayKey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now()+Math.floor(Math.random()*1000)};

/* ---------- state ---------- */
function defaults(){
  return {
    schedule:[{id:1,title:'Sample: Study block',time:'09:00',end:'11:00',days:'daily',last:'',pre:''}],
    tasks:[
      {id:2,title:'Sample: Revise JavaScript notes',pri:'high',due:dayKey(),done:false,mins:0},
      {id:3,title:'Sample: Finish one Node.js exercise',pri:'med',due:'',done:false,mins:0}],
    habits:[{id:4,name:'Sample: Read 10 pages',log:{}}],
    sessions:[],exits:[],journal:[],xp:0,earned:[],
    settings:{focus:60,brk:10,goal:240,lead:5,strict:true,voice:true,notify:true,keep:true,sound:'off',vol:0.4,theme:'auto',
      apps:['Instagram','YouTube','WhatsApp','Games'],sites:['youtube.com','instagram.com','x.com']}
  };
}
var S=load();
function load(){
  var d=defaults();
  try{var r=localStorage.getItem(K);if(r){var p=JSON.parse(r);Object.keys(p).forEach(function(k){d[k]=p[k]});d.settings=Object.assign(defaults().settings,p.settings||{});d.schedule.forEach(function(it){if(!it.end){var m=(+it.time.split(':')[0]*60+ +it.time.split(':')[1]+60)%1440;it.end=pad(Math.floor(m/60))+':'+pad(m%60)}})}}catch(e){}
  return d;
}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

var tab='home', run=null, promptOpen=false, warn='';
var TABS=[['home','Home'],['focus','Focus'],['plan','Plan'],['stats','Stats'],['settings','Settings']];

/* ---------- audio, voice, notifications ---------- */
var ac,master,cur=[];
function ctx(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.connect(ac.destination)}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function chime(){
  var c=ctx();if(!c)return;
  [880,1318].forEach(function(f,i){
    var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;
    var t=c.currentTime+i*0.18;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.8);
  });
}
function speak(text){
  chime();
  if(!S.settings.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=0.95;speechSynthesis.speak(u)}catch(e){}
}
function notify(title,body){
  if(!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  try{new Notification(title,{body:body})}catch(e){}
}
function noise(kind){
  var c=ac,n=c.sampleRate*3,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),last=0;
  for(var i=0;i<n;i++){var w=Math.random()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else d[i]=w*0.6}
  var s=c.createBufferSource();s.buffer=b;s.loop=true;return s;
}
function stopSound(){cur.forEach(function(n){try{if(n.stop)n.stop()}catch(e){}try{n.disconnect()}catch(e){}});cur=[]}
function setSound(name){
  stopSound();S.settings.sound=name;save();
  if(name==='off')return;
  var c=ctx();if(!c)return;
  master.gain.value=S.settings.vol;
  var g=c.createGain(),src,f;
  if(name==='rain'){src=noise('white');f=c.createBiquadFilter();f.type='highpass';f.frequency.value=900;var l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=7000;src.connect(f);f.connect(l);l.connect(g);g.gain.value=0.5;cur.push(src,f,l,g)}
  else if(name==='white'){src=noise('white');src.connect(g);g.gain.value=0.35;cur.push(src,g)}
  else if(name==='brown'){src=noise('brown');src.connect(g);g.gain.value=0.8;cur.push(src,g)}
  else if(name==='nature'){src=noise('brown');f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=700;src.connect(f);f.connect(g);g.gain.value=0.6;
    var lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=0.13;lg.gain.value=0.3;lfo.connect(lg);lg.connect(g.gain);lfo.start();cur.push(src,f,g,lfo,lg)}
  else if(name==='pad'){
    f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.connect(g);g.gain.value=0.5;cur.push(f,g);
    [110,164.8,220,261.6].forEach(function(fr,i){var o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.value=fr;og.gain.value=0.12;
      var l2=c.createOscillator(),lg2=c.createGain();l2.frequency.value=0.05+i*0.03;lg2.gain.value=0.08;l2.connect(lg2);lg2.connect(og.gain);
      o.connect(og);og.connect(f);o.start();l2.start();cur.push(o,og,l2,lg2)});
  }
  g.connect(master);if(src)src.start();
}

/* ---------- derived stats ---------- */
function focusMinOn(key){return S.sessions.filter(function(s){return dayKey(new Date(s.t))===key}).reduce(function(a,s){return a+s.min},0)}
function streak(){
  var days={};S.sessions.forEach(function(s){days[dayKey(new Date(s.t))]=1});
  var d=new Date(),n=0;if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n;
}
function level(){return 1+Math.floor(S.xp/300)}
function totalMin(){return S.sessions.reduce(function(a,s){return a+s.min},0)}
function badgeList(){
  var st=streak(),done=S.tasks.filter(function(t){return t.done}).length;
  var early=S.sessions.some(function(s){return new Date(s.t-s.min*60000).getHours()<7});
  var night=S.sessions.some(function(s){return new Date(s.t-s.min*60000).getHours()>=22});
  return [
    ['first','First hour','1','Finish one focus session',S.sessions.length>=1],
    ['s3','3-day streak','3','Focus three days in a row',st>=3],
    ['s7','7-day streak','7','Focus seven days in a row',st>=7],
    ['h10','10 hours','10','Reach 10 focused hours',totalMin()>=600],
    ['t5','Task finisher','5','Complete five tasks',done>=5],
    ['early','Early bird','AM','Start a session before 7 AM',early],
    ['night','Night owl','PM','Start a session after 10 PM',night]
  ];
}
function checkBadges(){
  badgeList().forEach(function(b){if(b[4]&&S.earned.indexOf(b[0])<0){S.earned.push(b[0]);toast('Badge earned: '+b[1])}});
}
function recommend(){
  var wk=Date.now()-7*864e5,ok=S.sessions.filter(function(s){return s.t>wk}).length,ex=S.exits.filter(function(s){return s>wk}).length;
  if(ok+ex<3)return null;
  var r=ex/(ok+ex);
  return r>0.3?{min:30,why:'You left '+ex+' of your last '+(ok+ex)+' sessions early. Shorter blocks may help.'}:{min:60,why:'You finished '+ok+' of '+(ok+ex)+' sessions this week. Full hours suit you.'};
}

/* ---------- session engine ---------- */
function startFocus(subject,taskId,cycle,windowEnd,intro){
  var now=Date.now(),rem=windowEnd-now;
  if(rem<60000){finishWindow((intro||'')+'Your study time is over.');return}
  var ms=Math.min(S.settings.focus*60000,rem),leaves=run?run.leaves:0;
  run={phase:'focus',total:ms,endAt:now+ms,paused:false,left:0,cycle:cycle||1,subject:subject||'Focus',taskId:taskId||null,leaves:leaves,leftAt:0,startedAt:now,windowEnd:windowEnd};
  tab='focus';warn='';
  speak((intro||'')+'Focus time started. '+run.subject);
  keepAwake();render();
}
function finishWindow(msg){
  run=null;releaseAwake();speak(msg);notify('Study session finished','Well done.');toast('Study session finished. Well done.');render();
}
function advance(){
  var now=Date.now();
  if(run.phase==='focus'){
    var min=Math.max(1,Math.round((now-run.startedAt)/60000));
    if(S.settings.keep)S.sessions.push({t:now,min:min,subject:run.subject,leaves:run.leaves});
    S.xp+=min;
    if(run.taskId){var t=S.tasks.filter(function(x){return x.id===run.taskId})[0];if(t)t.mins+=min}
    checkBadges();save();
    var rem=run.windowEnd-now;
    if(rem<60000){finishWindow('Your study time is over. Well done.');return}
    var b=Math.min(S.settings.brk*60000,rem);
    run.phase='break';run.total=b;run.endAt=now+b;
    speak('Your break has started.');notify('Break time','Your break has started. Apps are open.');
  }else if(run.phase==='break'){
    if(run.windowEnd-now<60000){finishWindow('Your break has ended. Your study time is over. Well done.');return}
    startFocus(run.subject,run.taskId,run.cycle+1,run.windowEnd,'Your break has ended. ');return;
  }
  render();
}
function endRun(){run=null;releaseAwake();render()}
var wl=null;
function keepAwake(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
function releaseAwake(){try{if(wl)wl.release()}catch(e){}wl=null}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function left(){return run.paused?run.left:run.endAt-Date.now()}
function tick(){
  if(!run)return;
  if(run.phase!=='ready'&&!run.paused&&run.endAt-Date.now()<=0){advance();return}
  var c=$('#clock');if(!c)return;
  var l=left();c.textContent=fmt(l);
  var r=$('#ringfg');if(r){var frac=run.total?Math.min(1,Math.max(0,l/run.total)):0;r.style.strokeDashoffset=(1-frac)*753.98}
}
setInterval(tick,250);

/* ---------- schedule ---------- */
function mins(hm){var p=hm.split(':');return +p[0]*60+ +p[1]}
function t12(hm){var m=mins(hm),h=Math.floor(m/60),mm=m%60;return (h%12===0?12:h%12)+':'+pad(mm)+' '+(h<12?'AM':'PM')}
function durMin(it){var d=mins(it.end)-mins(it.time);if(d<=0)d+=1440;return d}
function durText(it){var d=durMin(it);return Math.floor(d/60)+'h'+(d%60?' '+d%60+'m':'')}
function clockStr(ms){return new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function segs(a,b){var x=mins(a),y=mins(b);return y<=x?[[x,1440],[0,y]]:[[x,y]]}
function overlap(a,b){var A=segs(a.time,a.end),B=segs(b.time,b.end);return A.some(function(u){return B.some(function(v){return u[0]<v[1]&&v[0]<u[1]})})}
var pend=null,promptTimers=[];
function stopPromptTimers(){promptTimers.forEach(function(t){clearInterval(t);clearTimeout(t)});promptTimers=[]}
function checkSchedule(){
  if(promptOpen)return;
  var now=new Date(),nm=now.getHours()*60+now.getMinutes(),today=dayKey(now),dow=now.getDay(),lead=S.settings.lead|0;
  for(var i=0;i<S.schedule.length;i++){
    var it=S.schedule[i],st=mins(it.time);
    if(it.days==='weekdays'&&(dow===0||dow===6))continue;
    // heads-up a few minutes before the start
    if(lead>0&&it.pre!==today&&!run){
      var dPre=((nm-(st-lead))%1440+1440)%1440;
      if(dPre<=2){
        it.pre=today;save();
        speak('Heads up. '+it.title+' starts in '+lead+' minutes. Get ready.');
        notify('Study starts soon',it.title+' starts in '+lead+' minutes.');
        toast(it.title+' starts in '+lead+' minutes');
        return;
      }
    }
    if(it.last===today)continue;
    var diff=((nm-st)%1440+1440)%1440;
    if(diff<=2){
      it.last=today;save();
      if(run)return;
      var startMs=now.getTime()-diff*60000-now.getSeconds()*1000-now.getMilliseconds();
      var endAt=startMs+durMin(it)*60000;
      pend={id:it.id,end:endAt,title:it.title};
      promptOpen=true;
      var text="It is time to start. "+it.title+". Do you want to begin?";
      speak(text);notify('Time to study',it.title);
      promptTimers.push(setInterval(function(){speak(text)},60000));
      promptTimers.push(setTimeout(function(){if(promptOpen){closeModal();toast('No answer. This slot was skipped.')}},180000));
      modal('<h2>Time to study</h2><p><b>'+esc(it.title)+'</b><br><span class="muted">'+t12(it.time)+' to '+t12(it.end)+'</span></p>'+
        '<p class="muted">Start now? Press Yes or No, or type your answer.</p>'+
        '<div class="row"><input id="ans" class="grow" placeholder="type yes or no" autocomplete="off"><button class="btn" data-act="promptType">Send</button></div>'+

function nextUp(){

  exitAsk:function(){
    if(S.settings.strict)modal('<h2>Emergency exit</h2><p>Strict mode is on. To end the whole session before its end time, type EXIT.</p><input id="exitTxt" placeholder="Type EXIT" autocomplete="off" style="width:100%"><div class="row" style="margin-top:10px"><button class="btn primary" data-act="closeModal">Stay focused</button><button class="btn danger" data-act="exitYes">End session</button></div>');
    else modal('<h2>Leave this session?</h2><p>This counts as an early exit.</p><div class="row"><button class="btn primary" data-act="closeModal">Stay focused</button><button class="btn danger" data-act="exitYes">Leave session</button></div>')},
  exitYes:function(){
    if(S.settings.strict&&val('exitTxt').toUpperCase()!=='EXIT'){toast('Not ended. Type the word EXIT.');return}
    S.exits.push(Date.now());save();closeModal();endRun();toast('Session ended early')},
  closeModal:function(){closeModal()},
  skipBreak:function(){if(run&&run.phase==='break')startFocus(run.subject,run.taskId,run.cycle+1,run.windowEnd,'Break ended. ')},
  nextYes:function(){var c=run.cycle+1,sub=run.subject,id=run.taskId;startFocus(sub,id,c)},
  nextNo:function(){endRun()},
  promptYes:function(){var p=pend;closeModal();if(p&&!run){ctx();startFocus(p.title,null,1,p.end)}},
  promptType:function(){var v=val('ans').toLowerCase();if(['yes','y','yeah','ya','haan','han','ha','ok','okay','start','sure'].indexOf(v)>=0)actions.promptYes();else{closeModal();toast('Okay, the timer stays off.')}},
  promptNo:function(){closeModal();toast('Okay, the timer stays off.')},
  startSched:function(d){var it=S.schedule.filter(function(x){return String(x.id)===d.id})[0];ctx();if(it)startFocus(it.title,null,1,Date.now()+durMin(it)*60000)},
  addSched:function(){
    var t=val('sTitle'),st=val('sTime'),en=val('sEnd');
    if(!t){toast('Add a title first');return}
    if(!st||!en){toast('Set both a start and an end time');return}
    if(st===en){toast('End time must be different from the start time');return}
    var clash=S.schedule.filter(function(x){return overlap({time:st,end:en},x)})[0];
    if(clash){toast('Overlaps with "'+clash.title+'" ('+t12(clash.time)+' to '+t12(clash.end)+'). Change the times.');return}
    S.schedule.push({id:uid(),title:t,time:st,end:en,days:val('sDays')||'daily',last:'',pre:''});save();render()},
  delSched:function(d){removeById(S.schedule,d.id);save();render()},
  addTask:function(){var t=val('tTitle');if(!t){toast('Add a task title first');return}S.tasks.push({id:uid(),title:t,pri:val('tPri')||'med',due:val('tDue'),done:false,mins:0});save();render()},
  toggleTask:function(d){var t=S.tasks.filter(function(x){return String(x.id)===d.id})[0];if(t){t.done=!t.done;if(t.done){S.xp+=10;checkBadges()}save();render()}},
  delTask:function(d){removeById(S.tasks,d.id);save();render()},
  addHabit:function(){var n=val('hName');if(!n)return;S.habits.push({id:uid(),name:n,log:{}});save();render()},
  toggleHabit:function(d){var h=S.habits.filter(function(x){return String(x.id)===d.id})[0],k=dayKey();if(h){if(h.log[k])delete h.log[k];else h.log[k]=1;save();render()}},
  delHabit:function(d){removeById(S.habits,d.id);save();render()},
  sound:function(d){ctx();setSound(d.s);render()},
  fs:function(){var e=document.documentElement;try{var p=e.requestFullscreen&&e.requestFullscreen();if(p&&p.catch)p.catch(function(){toast('Full screen is not available here')})}catch(x){toast('Full screen is not available here')}},
  saveJ:function(){var t=val('jtext');if(!t)return;S.journal.push({t:Date.now(),text:t,subject:run?run.subject:''});save();$('#jtext').value='';toast('Saved to your journal')},
  applyRec:function(d){S.settings.focus=+d.m;save();render();toast('Focus length set to '+d.m+' min')},
  saveTimer:function(){var f=+val('setFocus'),b=+val('setBrk'),g=+val('setGoal'),ld=parseInt(val('setLead'),10);
    if(f>=1&&f<=180)S.settings.focus=Math.round(f);if(b>=1&&b<=60)S.settings.brk=Math.round(b);if(g>=15)S.settings.goal=Math.round(g);if(ld>=0&&ld<=60)S.settings.lead=ld;save();toast('Timer saved')},
  setting:function(d,el){S.settings[d.k]=el.checked;save()},
  testVoice:function(){speak('Your break has started.')},
  askNotif:function(){try{Notification.requestPermission().then(render)}catch(e){}},
  addBlock:function(d){var id=d.k==='apps'?'addApp':'addSite',v=val(id);if(!v)return;S.settings[d.k].push(v);save();render()},
  delBlock:function(d){S.settings[d.k].splice(+d.i,1);save();render()},
  clearAsk:function(){modal('<h2>Delete all data?</h2><p>This removes your sessions, tasks, habits, journal and settings from this device.</p><div class="row"><button class="btn primary" data-act="closeModal">Keep my data</button><button class="btn danger" data-act="clearYes">Delete everything</button></div>')},
  clearYes:function(){try{localStorage.removeItem(K)}catch(e){}S=defaults();stopSound();run=null;applyTheme();closeModal();render();toast('All data deleted')}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.type==='checkbox')return;
  var f=actions[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('change',function(e){
  var b=e.target.closest('[data-act]');if(b&&b.type==='checkbox'){var f=actions[b.dataset.act];if(f)f(b.dataset,b)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='vol'){S.settings.vol=+e.target.value;if(master)master.gain.value=S.settings.vol;save()}
});

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='ans')actions.promptType()});
/* leaving the session */
document.addEventListener('visibilitychange',function(){
  if(!run||run.phase!=='focus'||run.paused)return;
  if(document.hidden){run.leftAt=Date.now();run.leaves++}
  else if(run.leftAt){run.leftAt=0;warn='You left your focus session. Come back and keep going.';speak('You left your focus session. Stay with it.');render()}
});
window.addEventListener('beforeunload',function(e){if(run&&run.phase==='focus'){e.preventDefault();e.returnValue=''}});

applyTheme();render();setTimeout(checkSchedule,1500);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
